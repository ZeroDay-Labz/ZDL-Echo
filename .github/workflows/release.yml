name: Cross-Platform Release Build

# This workflow triggers manually from the Actions tab, 
# or automatically whenever a Git tag is pushed starting with "v" (e.g., v1.0.0)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# ---> This should fix the 403 permission denied error
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # This tells GitHub to spin up three separate virtual machines simultaneously
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # LINUX SPECIFIC: Install the audio and display C-headers
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-x11-dev libwayland-dev libxkbcommon-dev

      # WINDOWS & LINUX: Standard compilation
      - name: Build Release Binary
        if: matrix.os != 'macos-latest'
        run: cargo build --release

      # macOS SPECIFIC: Compile and package the .app bundle
      - name: Build macOS App Bundle
        if: matrix.os == 'macos-latest'
        run: |
          cargo install cargo-bundle
          cargo bundle --release
          # Zip the .app folder so it doesn't get corrupted when downloaded
          cd target/release/bundle/osx
          zip -r ../../../../ZDL-Echo-macOS.zip ZDL-Echo.app

      # LINUX SPECIFIC: package the already-built binary as .deb, .rpm and
      # .tar.gz (cargo-deb/generate-rpm read the [package.metadata.*]
      # sections in Cargo.toml for dependencies, assets, the .desktop file,
      # icons, and AppStream metadata under packaging/linux/)
      - name: Build Linux DEB/RPM/tar.gz
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-deb cargo-generate-rpm
          cargo deb --no-build
          cargo generate-rpm

          mkdir -p dist/zdl-echo-${{ github.ref_name }}
          cp target/release/ZDL-Echo dist/zdl-echo-${{ github.ref_name }}/zdl-echo
          cp -r packaging/linux/icons README.md LICENSE dist/zdl-echo-${{ github.ref_name }}/
          cp packaging/linux/zdl-echo.desktop packaging/linux/com.zerodaylabs.zdlecho.metainfo.xml dist/zdl-echo-${{ github.ref_name }}/
          tar czf ZDL-Echo-linux-x86_64.tar.gz -C dist zdl-echo-${{ github.ref_name }}

          cp target/debian/*.deb ZDL-Echo-amd64.deb
          cp target/generate-rpm/*.rpm ZDL-Echo-x86_64.rpm

      # UPLOAD TO GITHUB RELEASES (Only happens if you triggered via a tag)
      - name: Upload Windows Asset
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/ZDL-Echo.exe

      - name: Upload Linux Assets
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZDL-Echo-amd64.deb
            ZDL-Echo-x86_64.rpm
            ZDL-Echo-linux-x86_64.tar.gz

      - name: Upload macOS Asset
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZDL-Echo-macOS.zip

  # Separate job so a Flatpak failure never blocks the exe/zip/deb/rpm/tar.gz
  # uploads above. Installs flatpak-builder and the runtime/SDK/rust-stable
  # extension fresh from Flathub (rather than the pre-baked
  # flatpak-github-actions container images, which are frozen as of the image
  # build date and can lag behind egui's MSRV). Builds a self-contained
  # Flatpak bundle (network-isolated, vendored via
  # packaging/flatpak/generated-sources.json — see
  # packaging/flatpak/generate-sources.sh to regenerate it after a
  # Cargo.lock change). Not published to Flathub; just attached to the release.
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ZDL-Echo.flatpak
          manifest-path: packaging/flatpak/com.zerodaylabs.zdlecho.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}

      - name: Upload Flatpak Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZDL-Echo.flatpak