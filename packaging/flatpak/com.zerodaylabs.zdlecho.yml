app-id: com.zerodaylabs.zdlecho
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # bindgen (pipewire-sys, for software audio routing) needs libclang, which
  # isn't part of the base SDK — pull it in as its own extension.
  - org.freedesktop.Sdk.Extension.llvm20
command: zdl-echo

# audio via PipeWire's pulseaudio-compatible socket; wayland with an X11
# fallback for the GUI; no filesystem/network access needed at runtime
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  env:
    # matches the "dest": "cargo" path generated-sources.json writes its
    # vendored-source config to (cargo/config, not the default .cargo/) —
    # without this cargo never finds the offline source replacement
    CARGO_HOME: /run/build/zdl-echo/cargo
    # bindgen's libclang-sys looks here for libclang.so.*
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib

modules:
  - name: zdl-echo
    buildsystem: simple
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/ZDL-Echo /app/bin/zdl-echo
      - install -Dm644 packaging/linux/zdl-echo.desktop /app/share/applications/com.zerodaylabs.zdlecho.desktop
      - install -Dm644 packaging/linux/com.zerodaylabs.zdlecho.metainfo.xml /app/share/metainfo/com.zerodaylabs.zdlecho.metainfo.xml
      - install -Dm644 packaging/linux/icons/hicolor/16x16/apps/zdl-echo.png /app/share/icons/hicolor/16x16/apps/zdl-echo.png
      - install -Dm644 packaging/linux/icons/hicolor/32x32/apps/zdl-echo.png /app/share/icons/hicolor/32x32/apps/zdl-echo.png
      - install -Dm644 packaging/linux/icons/hicolor/48x48/apps/zdl-echo.png /app/share/icons/hicolor/48x48/apps/zdl-echo.png
      - install -Dm644 packaging/linux/icons/hicolor/64x64/apps/zdl-echo.png /app/share/icons/hicolor/64x64/apps/zdl-echo.png
      - install -Dm644 packaging/linux/icons/hicolor/128x128/apps/zdl-echo.png /app/share/icons/hicolor/128x128/apps/zdl-echo.png
      - install -Dm644 packaging/linux/icons/hicolor/256x256/apps/zdl-echo.png /app/share/icons/hicolor/256x256/apps/zdl-echo.png
    sources:
      - type: dir
        path: ../..
      - generated-sources.json
