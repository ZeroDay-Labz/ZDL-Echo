app-id: com.zerodaylabs.zdlecho
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: zdl-echo

# audio via PipeWire's pulseaudio-compatible socket; wayland with an X11
# fallback for the GUI; no filesystem/network access needed at runtime
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: zdl-echo
    buildsystem: simple
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/ZDL-Echo /app/bin/zdl-echo
      - install -Dm644 packaging/linux/zdl-echo.desktop /app/share/applications/com.zerodaylabs.zdlecho.desktop
      - install -Dm644 packaging/linux/com.zerodaylabs.zdlecho.metainfo.xml /app/share/metainfo/com.zerodaylabs.zdlecho.metainfo.xml
      - >-
        for size in 16 32 48 64 128 256; do
          install -Dm644 packaging/linux/icons/hicolor/${size}x${size}/apps/zdl-echo.png
            /app/share/icons/hicolor/${size}x${size}/apps/zdl-echo.png;
        done
    sources:
      - type: dir
        path: ../..
      - generated-sources.json
